services:

  payment-service-app:
    build: .
    container_name: payment-service-app
    restart: unless-stopped
    working_dir: /var/www

    volumes:
      - ./:/var/www

    environment:
      DB_HOST: payment-service-db
      DB_DATABASE: payment_db
      DB_USERNAME: root
      DB_PASSWORD: root

    depends_on:
      - payment-service-db

    networks:
      - laravel-net

  payment-service-nginx:
    image: nginx:stable-alpine
    container_name: payment-service-nginx
    restart: unless-stopped

    ports:
      - "8003:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - payment-service-app

    networks:
      - laravel-net

  payment-service-db:
    image: mysql:8.0
    container_name: payment-service-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: payment_db
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    networks:
      - laravel-net

networks:
  laravel-net:
    external: true